name: befit_fitness_app
description: BeFit Fitness App
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  go_router: ^16.2.4
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2
  google_fonts: ^6.3.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  lottie: ^3.3.2
  fl_chart: ^1.1.1
  animated_text_kit: ^4.3.0
  page_transition: ^2.2.1
  timeline_tile: ^2.0.0
  google_sign_in: ^6.1.5
  video_player: ^2.10.0
  youtube_explode_dart: ^2.5.2
  flutter_gemini: ^3.0.0
  shared_preferences: ^2.5.3
  get_it: ^8.2.0
  injectable: ^2.5.2
  dio: ^5.9.0
  connectivity_plus: ^7.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  logger: ^2.6.2
  cached_network_image: ^3.4.1
  permission_handler: ^12.0.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  provider: ^6.1.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  mobile_scanner: ^5.2.3
  flutter_dotenv: ^5.1.0
  confetti: ^0.8.0
  image_picker: ^1.1.2
  flutter_body_part_selector: ^1.2.1
  flutter_picker: ^2.0.0
  hidden_drawer_menu: ^3.0.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.0.1
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.3
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/onboarding/lotties/
    - assets/onboarding/icons/
    - assets/home/icons/
    - assets/home/images/
    - assets/home/lotties/
    - assets/lotties/
    - assets/lotties/authentication/
    - assets/lotties/onboarding/
    - assets/svg/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true  # App Store requires no transparency
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#01FBE2"
    theme_color: "#01FBE2"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

# Flutter Native Splash (launch screen using app icon)
flutter_native_splash:
  color: "#000000"
  image: "assets/icons/app_icon.png"
  android_12:
    color: "#000000"
    image: "assets/icons/app_icon.png"
    icon_background_color: "#000000"